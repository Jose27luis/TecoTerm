config:
  validation: true

build:
  maxIssues: 0

tecoterm:
  active: true
  NoCommentsRule:
    active: true
  NoNotNullAssertionRule:
    active: true
  NoUnsafeCastRule:
    active: true
  NoAnyTypeRule:
    active: true
  NoSuppressRule:
    active: true
  NoLateinitRule:
    active: true
  NoGlobalScopeRule:
    active: true

naming:
  FunctionNaming:
    ignoreAnnotated:
      - Composable
  MatchingDeclarationName:
    active: true

complexity:
  TooManyFunctions:
    ignorePrivate: true
    thresholdInClasses: 13

style:
  MaxLineLength:
    maxLineLength: 140
